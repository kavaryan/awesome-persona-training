name: Validate research map
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.2.0 ruff==0.17.3
      - run: |
          pytest -q
          ruff check persona_map tests scripts
          python -m persona_map.cli validate
          python -m persona_map.cli render
          git diff --exit-code -- docs/catalogue.md data/catalogue.csv data/catalogue.bib
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run lint:awesome
