[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-map-factory"
version = "0.1.0"
description = "Build evidence-grounded research repositories from a brief and seed works"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.13,<5", "feedparser>=6,<7", "pypdf>=6,<7", "fonttools>=4.55,<5", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
research-factory = "research_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_factory = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
