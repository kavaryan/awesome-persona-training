name: Daily research discovery
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Resume bounded historical discovery
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-research
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            downloads
            .cache/evidence
          key: research-${{ runner.os }}-${{ github.run_id }}
          restore-keys: research-${{ runner.os }}-
      - name: Discover, read, classify and download
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=()
          if [ "$BACKFILL" = "true" ]; then args+=(--backfill); fi
          python -m research_map.cli run "${args[@]}"
      - name: Validate and export
        run: |
          python -m research_map.cli validate
          python -m research_map.cli render
      - name: Save progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/catalogue.md reports/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update evidence-reviewed research map'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-audit-${{ github.run_id }}
          path: |
            reports/latest-run.json
            data/notebooklm-manifest.json
            data/discovery-state.json
          retention-days: 90
